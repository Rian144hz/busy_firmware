<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busy - Visualizacao 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0e0e12; font-family: monospace; }
    #hud {
      position: absolute; top: 12px; left: 12px; color: #6cf;
      background: rgba(0,0,0,.5); padding: 8px 12px; border-radius: 6px;
      font-size: 13px; line-height: 1.5;
    }
    #hud b { color: #fff; }
    #status { color: #9f9; }
  </style>
</head>
<body>
  <div id="hud">
    <div><b>BUSY</b> - visualizacao 3D (demo)</div>
    <div>Expressao: <span id="expr">aguardando</span></div>
    <div>Movimento: <span id="mov">parado</span></div>
    <div>Cerebro: <span id="status">conectando...</span></div>
  </div>

  <!-- Three.js via CDN (nao precisa instalar nada) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // ===== Cena =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e0e12);
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 4);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luz
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const luz = new THREE.DirectionalLight(0xffffff, 0.8);
    luz.position.set(2, 4, 3);
    scene.add(luz);

    // ===== Corpo (pescoço/poste) =====
    const poste = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.15, 1.2, 16),
      new THREE.MeshStandardMaterial({ color: 0x333344 })
    );
    poste.position.y = 0.6;
    scene.add(poste);

    // ===== Cabeca (gira = PAN/YAW, inclina = TILT/PITCH) =====
    const headGroup = new THREE.Group();
    headGroup.position.y = 1.4;
    scene.add(headGroup);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xe8e8ee })
    );
    headGroup.add(head);

    // Olhos
    const olhoGeo = new THREE.SphereGeometry(0.08, 16, 16);
    const olhoMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const olhoE = new THREE.Mesh(olhoGeo, olhoMat); olhoE.position.set(-0.18, 0.1, 0.45);
    const olhoD = new THREE.Mesh(olhoGeo, olhoMat); olhoD.position.set(0.18, 0.1, 0.45);
    headGroup.add(olhoE); headGroup.add(olhoD);

    // "Boca" (expressao muda o formato)
    const boca = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.05, 0.02),
      new THREE.MeshBasicMaterial({ color: 0x222222 })
    );
    boca.position.set(0, -0.15, 0.46);
    headGroup.add(boca);

    // Tela frontal (onde escreve a expressao)
    const telaCanvas = document.createElement('canvas');
    telaCanvas.width = 256; telaCanvas.height = 128;
    const telaCtx = telaCanvas.getContext('2d');
    const telaTex = new THREE.CanvasTexture(telaCanvas);
    const tela = new THREE.Mesh(
      new THREE.PlaneGeometry(0.55, 0.28),
      new THREE.MeshBasicMaterial({ map: telaTex })
    );
    tela.position.set(0, 0.32, 0.46);
    headGroup.add(tela);

    function desenharTela(texto) {
      telaCtx.fillStyle = '#0a0a0a'; telaCtx.fillRect(0, 0, 256, 128);
      telaCtx.fillStyle = '#44ff88'; telaCtx.font = 'bold 28px monospace';
      telaCtx.textAlign = 'center'; telaCtx.textBaseline = 'middle';
      telaCtx.fillText(texto, 128, 64);
      telaTex.needsUpdate = true;
    }
    desenharTela('BUSY');

    // ===== Movimento (igual servo pan/tilt do firmware) =====
    function aplicarMovimento(mov) {
      // reset suave pro centro
      let yaw = 0, pitch = 0;
      if (mov === 'acena_direita') yaw = -0.5;
      else if (mov === 'acena_esquerda') yaw = 0.5;
      else if (mov === 'olha_cima') pitch = -0.4;
      else if (mov === 'olha_baixo') pitch = 0.4;

      headGroup.rotation.y = yaw;
      headGroup.rotation.x = pitch;

      // boca vira "sorriso" se animado/sorrindo
      if (mov === 'parado') boca.scale.y = 1;
    }

    // ===== Loop de consulta ao cerebro =====
    const BRAIN = 'http://localhost:8000/proximo';
    async function consultar() {
      try {
        const r = await fetch(BRAIN);
        const d = await r.json();
        document.getElementById('expr').textContent = d.expressao;
        document.getElementById('mov').textContent = d.movimento;
        document.getElementById('status').textContent = 'online';
        desenharTela(d.expressao);
        aplicarMovimento(d.movimento);
      } catch (e) {
        document.getElementById('status').textContent = 'cerebro off (rode server.py)';
        desenharTela('OFFLINE');
      }
    }
    setInterval(consultar, 2000);
    consultar();

    // ===== Render =====
    function animate() {
      requestAnimationFrame(animate);
      headGroup.rotation.y *= 0.95; // volta pro centro devagar
      headGroup.rotation.x *= 0.95;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
